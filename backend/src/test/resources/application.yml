spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  cache:
    type: simple

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

app:
  jwt:
    secret: testSecretKeyForTestingOnly12345678901234567890
    expiration: 86400000
  cors:
    allowed-origins: http://localhost:5173

stripe:
  secret-key: sk_test_placeholder_for_tests
  webhook-secret: whsec_test_secret_123
  price-pro: price_test_pro
  price-enterprise: price_test_enterprise
  success-url: http://localhost:5173/billing/success
  cancel-url: http://localhost:5173/
